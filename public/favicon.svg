<!-- ABOUTME: SVG favicon for Marginalia — a page with margin line and annotation dot. -->
<!-- ABOUTME: Uses the app's editorial palette: cream background, ink border, sienna accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Page background with subtle rounded corners -->
  <rect x="3" y="2" width="26" height="28" rx="2" fill="#fdf9f0" stroke="#2a2622" stroke-width="1.5"/>

  <!-- Margin line — the defining feature of marginalia -->
  <line x1="11" y1="2" x2="11" y2="30" stroke="#b45309" stroke-width="1.5" opacity="0.7"/>

  <!-- Text lines on the page -->
  <line x1="14" y1="9" x2="25" y2="9" stroke="#b5b1ab" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="14" x2="24" y2="14" stroke="#b5b1ab" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="19" x2="25" y2="19" stroke="#b5b1ab" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="24" x2="21" y2="24" stroke="#b5b1ab" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Annotation mark in the margin — a bold sienna dot -->
  <circle cx="7" cy="14" r="2.5" fill="#b45309"/>
</svg>
